[package]
name = "maree"
version = "1.0.0"
description = "Marée — a local-first mathematical problem library"
authors = ["Marée contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "maree_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
zip = { version = "4.6", default-features = false, features = ["deflate"] }
tiny_http = "0.12"
if-addrs = "0.13"
clipboard-win = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
